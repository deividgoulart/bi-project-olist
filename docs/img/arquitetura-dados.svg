<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#131B33"/>
    </marker>
  </defs>
  <rect width="1180" height="470" fill="#FFFFFF"/>

  <!-- ================= origem: arquivos CSV ================= -->
  <text x="26" y="34" font-size="14" fill="#4C5378">Dataset público (Kaggle)</text>

  <g stroke="#131B33" stroke-width="2" fill="#FFFFFF">
    <rect x="26" y="48"  width="196" height="58" rx="10"/>
    <rect x="26" y="126" width="196" height="58" rx="10"/>
    <rect x="26" y="204" width="196" height="58" rx="10"/>
    <rect x="26" y="282" width="196" height="76" rx="10"/>
  </g>
  <g font-size="14" fill="#131B33" text-anchor="middle">
    <text x="124" y="72">olist_orders</text>
    <text x="124" y="150">olist_order_items</text>
    <text x="124" y="228">olist_order_reviews</text>
    <text x="124" y="312">olist_customers</text>
    <text x="124" y="330">olist_products</text>
    <text x="124" y="348">olist_sellers</text>
  </g>
  <g font-size="12" fill="#4C5378" text-anchor="middle">
    <text x="124" y="90">CSV · pedidos e entregas</text>
    <text x="124" y="168">CSV · itens do pedido</text>
    <text x="124" y="246">CSV · avaliações</text>
  </g>

  <!-- ================= hospedagem ================= -->
  <text x="292" y="176" font-size="14" fill="#4C5378" text-anchor="middle">Hospedagem</text>
  <rect x="262" y="190" width="150" height="86" rx="10" fill="#FFFFFF" stroke="#131B33" stroke-width="2"/>
  <text x="337" y="228" font-size="15" fill="#131B33" text-anchor="middle" font-weight="600">GitHub</text>
  <text x="337" y="250" font-size="12" fill="#4C5378" text-anchor="middle">raw.githubusercontent</text>

  <g stroke="#131B33" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <path d="M 222 77  L 258 210"/>
    <path d="M 222 155 L 258 224"/>
    <path d="M 222 233 L 258 238"/>
    <path d="M 222 320 L 258 254"/>
  </g>

  <!-- ================= transformacao ================= -->
  <text x="562" y="176" font-size="14" fill="#4C5378" text-anchor="middle">Transformação</text>
  <rect x="472" y="190" width="180" height="86" rx="10" fill="#FFFFFF" stroke="#131B33" stroke-width="2"/>
  <text x="562" y="222" font-size="15" fill="#131B33" text-anchor="middle" font-weight="600">Power Query</text>
  <text x="562" y="243" font-size="12" fill="#4C5378" text-anchor="middle">linguagem M</text>
  <text x="562" y="260" font-size="12" fill="#4C5378" text-anchor="middle">modo Import</text>

  <path d="M 412 233 L 468 233" stroke="#131B33" stroke-width="1.6" fill="none" marker-end="url(#seta)"/>
  <text x="440" y="224" font-size="12" fill="#131B33" text-anchor="middle">HTTP</text>

  <!-- ================= modelagem ================= -->
  <text x="792" y="176" font-size="14" fill="#4C5378" text-anchor="middle">Modelagem</text>
  <rect x="702" y="190" width="180" height="86" rx="10" fill="#FFFFFF" stroke="#131B33" stroke-width="2"/>
  <text x="792" y="222" font-size="15" fill="#131B33" text-anchor="middle" font-weight="600">Modelo Tabular</text>
  <text x="792" y="243" font-size="12" fill="#4C5378" text-anchor="middle">estrela · 2 fatos</text>
  <text x="792" y="260" font-size="12" fill="#4C5378" text-anchor="middle">9 medidas DAX</text>

  <path d="M 652 233 L 698 233" stroke="#131B33" stroke-width="1.6" fill="none" marker-end="url(#seta)"/>

  <!-- ================= visualizacao ================= -->
  <text x="1032" y="176" font-size="14" fill="#4C5378" text-anchor="middle">Visualização</text>
  <rect x="932" y="190" width="200" height="86" rx="10" fill="#FFFFFF" stroke="#131B33" stroke-width="2"/>
  <text x="1032" y="228" font-size="15" fill="#131B33" text-anchor="middle" font-weight="600">Power BI</text>
  <text x="1032" y="250" font-size="12" fill="#4C5378" text-anchor="middle">Desktop · formato PBIP</text>

  <path d="M 882 233 L 928 233" stroke="#131B33" stroke-width="1.6" fill="none" marker-end="url(#seta)"/>

  <!-- ================= visuais customizados ================= -->
  <text x="1032" y="330" font-size="14" fill="#4C5378" text-anchor="middle">Camada de apresentação</text>
  <rect x="932" y="344" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#0A4EE4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1032" y="374" font-size="14" fill="#0A4EE4" text-anchor="middle" font-weight="600">8 visuais customizados</text>
  <text x="1032" y="396" font-size="12" fill="#4C5378" text-anchor="middle">TypeScript · Power BI Visuals SDK</text>
  <path d="M 1032 280 L 1032 340" stroke="#0A4EE4" stroke-width="1.6" fill="none" marker-end="url(#seta)"/>

  <!-- ================= nota ================= -->
  <text x="26" y="404" font-size="12" fill="#4C5378">Não há data warehouse nem pipeline agendado: o projeto é conceitual e toda a camada de transformação</text>
  <text x="26" y="422" font-size="12" fill="#4C5378">que num cenário real estaria no ELT foi implementada no Power Query.</text>
  <text x="26" y="452" font-size="12" fill="#8A90AE">Dashboard de Operações e CX · Deivid Goulart Massiroli</text>
</svg>
